<!-- Video.js 10.1.0: live preset (player + skin) and the hls.js media element.
     Keep every @videojs/cdn URL pinned to the same version. -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.1.0/live-video.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.1.0/media/hlsjs-video.js"></script>

<style>
  /* Widen the theme's narrow content column so the 2x2 grid fits */
  .wrapper { width: auto; max-width: 1400px; }
  section { width: auto; float: none; max-width: 100%; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .cam h2 { margin: 0 0 .4rem; font-size: 1rem; }
  live-video-skin { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
</style>

<div class="grid">

  <div class="cam">
    <h2>Camera 1 (test)</h2>
    <live-video-player>
      <live-video-skin>
        <hlsjs-video src="https://serfcams.duckdns.org/live/cam1.stream/playlist.m3u8" autoplay muted playsinline></hlsjs-video>
      </live-video-skin>
    </live-video-player>
  </div>
