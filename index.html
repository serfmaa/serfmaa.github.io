---
layout: default
---
<script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.1.0/live-video.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.1.0/media/hlsjs-video.js"></script>

<style>
  .wrapper { width: auto; max-width: 1400px; }
  section { width: auto; float: none; max-width: 100%; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .cam h2 { margin: 0 0 .4rem; font-size: 1rem; }
  live-video-skin { display: block; width: 100%; aspect-ratio: 16 / 9; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

  media-error-dialog { display: none !important; }

  /* Square corners on the player */
  live-video-player,
  live-video-skin,
  hlsjs-video {
    --media-video-border-radius: 0;
    border-radius: 0;
  }
</style>

<div class="grid">
  <div class="cam">
    <h2>Camera 1</h2>
    <live-video-player>
      <live-video-skin>
        <hlsjs-video data-src="https://serfcams.duckdns.org/live/cam1.stream/playlist.m3u8" autoplay muted playsinline></hlsjs-video>
      </live-video-skin>
    </live-video-player>
  </div>

  <div class="cam">
    <h2>Camera 2</h2>
    <live-video-player>
      <live-video-skin>
        <hlsjs-video data-src="https://serfcams.duckdns.org/live/cam2.stream/playlist.m3u8" autoplay muted playsinline></hlsjs-video>
      </live-video-skin>
    </live-video-player>
  </div>

  <div class="cam">
    <h2>Camera 3</h2>
    <live-video-player>
      <live-video-skin>
        <hlsjs-video data-src="https://serfcams.duckdns.org/live/cam3.stream/playlist.m3u8" autoplay muted playsinline></hlsjs-video>
      </live-video-skin>
    </live-video-player>
  </div>

  <div class="cam">
    <h2>Camera 4</h2>
    <live-video-player>
      <live-video-skin>
        <hlsjs-video data-src="https://serfcams.duckdns.org/live/cam4.stream/playlist.m3u8" autoplay muted playsinline></hlsjs-video>
      </live-video-skin>
    </live-video-player>
  </div>
</div>

<script>
  (function () {
    var POLL_MS = 5000;    // how often to check whether an offline camera is live
    var WATCH_MS = 2000;   // how often to check that a playing camera is still advancing
    var STALL_MS = 10000;  // unload the player if video time hasn't advanced for this long

    // If the skin renders its error dialog inside a shadow root, page CSS can't
    // reach it, so inject the same hiding rule into any shadow roots we can see.
    var HIDE = 'media-error-dialog, media-dialog-backdrop, media-dialog-popup { display: none !important; }';
    function hideErrorDialogs(root) {
      if (!root) return;
      root.querySelectorAll('*').forEach(function (n) {
        if (n.shadowRoot) {
          if (!n.shadowRoot.querySelector('style[data-hide-errors]')) {
            var s = document.createElement('style');
            s.setAttribute('data-hide-errors', '');
            s.textContent = HIDE;
            n.shadowRoot.appendChild(s);
          }
          hideErrorDialogs(n.shadowRoot);
        }
      });
    }

    function setup(el) {
      var url = el.getAttribute('data-src');
      var player = el.closest('live-video-player');
      var playing = false;
      var lastTime = -1;
      var lastChange = 0;

      async function isLive() {
        try {
          var r = await fetch(url + (url.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(), { cache: 'no-store' });
          if (!r.ok) return false;
          var text = await r.text();
          return text.indexOf('#EXTM3U') === 0;
        } catch (e) {
          return false;
        }
      }

      function start() {
        playing = true;
        lastTime = -1;
        lastChange = Date.now();
        el.src = url;
        try {
          var p = el.play();
          if (p && p.catch) p.catch(function () {});
        } catch (e) {}
      }

      // Unload so the player never reaches a fatal error (and its error dialog).
      function stop() {
        playing = false;
        try { el.src = ''; } catch (e) {}
      }

      // Offline: poll the playlist until the camera is live.
      // Playing: don't touch the server; just watch whether video time advances.
      async function tick() {
        try {
          if (!playing) {
            if (await isLive()) start();
          } else if (!document.hidden && !el.paused) {
            var t = el.currentTime;
            if (t !== lastTime) {
              lastTime = t;
              lastChange = Date.now();
            } else if (Date.now() - lastChange > STALL_MS) {
              stop();
            }
          }
        } catch (e) {
          console.error('camera loop error', e);
        } finally {
          setTimeout(tick, playing ? WATCH_MS : POLL_MS);
        }
      }

      // Backup: if an error still happens, reset and go back to waiting.
      el.addEventListener('error', function () {
        stop();
        hideErrorDialogs(player);
      });

      hideErrorDialogs(player);
      tick();
    }

    // The player elements are defined by module scripts that load after this
    // script runs, so wait for them before touching src/play().
    Promise.all([
      customElements.whenDefined('live-video-player'),
      customElements.whenDefined('hlsjs-video')
    ]).then(function () {
      document.querySelectorAll('hlsjs-video[data-src]').forEach(setup);
      setTimeout(function () { hideErrorDialogs(document); }, 500);
      setTimeout(function () { hideErrorDialogs(document); }, 3000);
    });
  })();
</script>
