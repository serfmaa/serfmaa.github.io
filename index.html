---
layout: default
---
<script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.1.0/live-video.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.1.0/media/hlsjs-video.js"></script>

<style>
  .wrapper { width: auto; max-width: 1400px; }
  section { width: auto; float: none; max-width: 100%; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .cam h2 { margin: 0 0 .4rem; font-size: 1rem; }
  live-video-skin { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

  /* Hide Video.js's built-in error dialog (it shows raw errors like "no EXTM3U delimiter") */
  media-error-dialog { display: none !important; }

  /* Our own friendly status shown while a camera is offline */
  .screen { position: relative; }
  .offline {
    position: absolute; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: #9a9a9a; font-size: 1rem; text-align: center; padding: 1rem;
  }
  .offline[hidden] { display: none; }
</style>

<div class="grid">
  <div class="cam">
    <h2>Camera 1</h2>
    <live-video-player>
      <live-video-skin>
        <hlsjs-video data-src="https://serfcams.duckdns.org/live/cam1.stream/playlist.m3u8" autoplay muted playsinline></hlsjs-video>
      </live-video-skin>
    </live-video-player>
  </div>

  <div class="cam">
    <h2>Camera 2</h2>
    <live-video-player>
      <live-video-skin>
        <hlsjs-video data-src="https://serfcams.duckdns.org/live/cam2.stream/playlist.m3u8" autoplay muted playsinline></hlsjs-video>
      </live-video-skin>
    </live-video-player>
  </div>

  <div class="cam">
    <h2>Camera 3</h2>
    <live-video-player>
      <live-video-skin>
        <hlsjs-video data-src="https://serfcams.duckdns.org/live/cam3.stream/playlist.m3u8" autoplay muted playsinline></hlsjs-video>
      </live-video-skin>
    </live-video-player>
  </div>

  <div class="cam">
    <h2>Camera 4</h2>
    <live-video-player>
      <live-video-skin>
        <hlsjs-video data-src="https://serfcams.duckdns.org/live/cam4.stream/playlist.m3u8" autoplay muted playsinline></hlsjs-video>
      </live-video-skin>
    </live-video-player>
  </div>
</div>

<script>
  (function () {
    var POLL_MS = 5000;

    document.querySelectorAll('hlsjs-video[data-src]').forEach(function (el) {
      var url = el.getAttribute('data-src');
      var timer = null;

      var player = el.closest('live-video-player');
      var screen = document.createElement('div');
      screen.className = 'screen';
      player.parentNode.insertBefore(screen, player);
      screen.appendChild(player);
      var overlay = document.createElement('div');
      overlay.className = 'offline';
      overlay.textContent = 'Camera offline \u2013 waiting for stream\u2026';
      screen.appendChild(overlay);

      function schedule() {
        if (!timer) timer = setTimeout(check, POLL_MS);
      }

      async function isLive() {
        try {
          var r = await fetch(url + (url.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(), { cache: 'no-store' });
          if (!r.ok) return false;
          var text = await r.text();
          return text.indexOf('#EXTM3U') === 0;
        } catch (e) {
          return false;
        }
      }

      async function check() {
        timer = null;
        if (await isLive()) {
          el.removeAttribute('src');
          el.src = url;
          try { await el.play(); } catch (e) {}
        } else {
          schedule();
        }
      }

      el.addEventListener('playing', function () { overlay.hidden = true; });

      el.addEventListener('error', function () {
        overlay.hidden = false;
        el.removeAttribute('src');
        schedule();
      });

      check();
    });
  })();
</script>
