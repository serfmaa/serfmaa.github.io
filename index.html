---
layout: default
---
<script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.1.0/live-video.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.1.0/media/hlsjs-video.js"></script>

<style>
  .wrapper { width: auto; max-width: 1400px; }
  section { width: auto; float: none; max-width: 100%; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .cam h2 { margin: 0 0 .4rem; font-size: 1rem; }
  live-video-skin { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

  /* Hide Video.js's built-in error dialog */
  media-error-dialog { display: none !important; }
</style>

<div class="grid">
  <div class="cam">
    <h2>Camera 1</h2>
    <live-video-player>
      <live-video-skin>
        <hlsjs-video data-src="https://serfcams.duckdns.org/live/cam1.stream/playlist.m3u8" autoplay muted playsinline></hlsjs-video>
      </live-video-skin>
    </live-video-player>
  </div>

  <div class="cam">
    <h2>Camera 2</h2>
    <live-video-player>
      <live-video-skin>
        <hlsjs-video data-src="https://serfcams.duckdns.org/live/cam2.stream/playlist.m3u8" autoplay muted playsinline></hlsjs-video>
      </live-video-skin>
    </live-video-player>
  </div>

  <div class="cam">
    <h2>Camera 3</h2>
    <live-video-player>
      <live-video-skin>
        <hlsjs-video data-src="https://serfcams.duckdns.org/live/cam3.stream/playlist.m3u8" autoplay muted playsinline></hlsjs-video>
      </live-video-skin>
    </live-video-player>
  </div>

  <div class="cam">
    <h2>Camera 4</h2>
    <live-video-player>
      <live-video-skin>
        <hlsjs-video data-src="https://serfcams.duckdns.org/live/cam4.stream/playlist.m3u8" autoplay muted playsinline></hlsjs-video>
      </live-video-skin>
    </live-video-player>
  </div>
</div>

<script>
  (function () {
    var POLL_MS = 5000;   // how often to check an offline camera
    var CHECK_MS = 2000;  // how often to check a playing camera
    var MISSES = 2;       // consecutive failed checks before we unload the player

    // If the skin renders its error dialog inside a shadow root, page CSS can't
    // reach it, so inject the same hiding rule into any shadow roots we can see.
    var HIDE = 'media-error-dialog, media-dialog-backdrop, media-dialog-popup { display: none !important; }';
    function hideErrorDialogs(root) {
      if (!root) return;
      root.querySelectorAll('*').forEach(function (n) {
        if (n.shadowRoot && !n.shadowRoot.querySelector('style[data-hide-errors]')) {
          var s = document.createElement('style');
          s.setAttribute('data-hide-errors', '');
          s.textContent = HIDE;
          n.shadowRoot.appendChild(s);
        }
        if (n.shadowRoot) hideErrorDialogs(n.shadowRoot);
      });
    }

    document.querySelectorAll('hlsjs-video[data-src]').forEach(function (el) {
      var url = el.getAttribute('data-src');
      var player = el.closest('live-video-player');
      var playing = false;
      var misses = 0;
      var timer = null;

      async function isLive() {
        try {
          var r = await fetch(url + (url.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(), { cache: 'no-store' });
          if (!r.ok) return false;
          var text = await r.text();
          return text.indexOf('#EXTM3U') === 0;
        } catch (e) {
          return false;
        }
      }

      function start() {
        playing = true;
        misses = 0;
        el.removeAttribute('src');   // clear first so the same URL isn't ignored
        el.src = url;
        el.play().catch(function () {});
      }

      // Unload before the player hits a fatal error, so no error dialog appears.
      function stop() {
        playing = false;
        el.removeAttribute('src');
      }

      async function tick() {
        var ok = await isLive();
        if (!playing) {
          if (ok) start();
        } else if (!ok) {
          if (++misses >= MISSES) stop();
        } else {
          misses = 0;
        }
        timer = setTimeout(tick, playing ? CHECK_MS : POLL_MS);
      }

      // Backup: if an error still happens, reset and go back to waiting.
      el.addEventListener('error', function () {
        stop();
        hideErrorDialogs(player);
      });

      hideErrorDialogs(player);
      tick();
    });

    // The skin may render after load, so re-run once it's defined.
    customElements.whenDefined('live-video-skin').then(function () {
      setTimeout(function () { hideErrorDialogs(document); }, 500);
    });
  })();
</script>
